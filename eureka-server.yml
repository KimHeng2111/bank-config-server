eureka:
  client:
    register-witheureka: false
    fetch-registry: false
    serviceUrl:
      defaultZone: http://${EUREKA_SERVER:localhost}:${EUREKA_PORT:9000}/eureka/
  environment: Default
logging:
  level:
    com.netflix.eureka: OFF
    com.netflix.discovery: OFF
info:
  app:
    name: Eureka Default Server
    description: KimHengMicroServiceBank
    version: 1.0.1
